name: E2E (real browser)

# Separate from ci.yml deliberately: this job needs to download a real
# Chromium binary (~150MB), which is slower and network-dependent in a way
# the jsdom-based unit suite isn't. Keeping it isolated means a flaky
# browser download doesn't block the fast lint/unit/coverage feedback loop.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
